[project]
name = "sparse-cafm"
version = "0.1.0"
description = "SparseC-AFM: fast 2D-material acquisition & analysis with super resolution models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
    "gradio>=4.44.0",
    "pillow>=9.0",
    "scipy>=1.9",
    "timm>=0.9",
    "matplotlib>=3.5",
]

[tool.uv]
package = false
