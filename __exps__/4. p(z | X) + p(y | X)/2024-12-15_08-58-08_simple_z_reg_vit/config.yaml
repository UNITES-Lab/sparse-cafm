global:
  device: 0

model:
  name: simple_z_reg_vit
  pretrained: True

training:
  batch_size: 16
  steps_per_epoch: 256
  epochs: 2000
  loss: L1
  lr: 1e-8
  optimizer: Adam

validation:
  batch_size: 16
  steps_per_epoch: 256
  loss: L1

dataset:
  name: SapphireDataset
  image_size: 224
  crop_size: 64
  num_workers: 0

logging:
  root: "/playpen/mufan/levi/tianlong-chen-lab/material-super-resolution/__exps__/4. p(z | X) + p(y | X)"
  exp_name: simple_z_reg_vit
  result_columns: ["global_train_step", "global_val_step", "epoch", "train_loss", "val_loss", "z"]
  save_weights: true
  save_only_best_weights: true
  enable_tensorboard: false
  log_figures: false
  log_interval: 256