global:
  device: 5

model:
  variant: ResNet152
  pretrained: True

training:
  batch_size: 16
  steps_per_epoch: 256
  epochs: 2000
  loss: L1
  lr: 1e-4
  optimizer: Adam

validation:
  batch_size: 16
  steps_per_epoch: 256
  loss: MSE

dataset:
  name: SapphireDataset
  image_size: 256
  crop_size: 64

logging:
  exp_name: f1_direct_regression_MSE_2000
  result_columns:  ["global_train_step", "global_val_step", "epoch", "train_loss", "val_loss"]
  log_figures: false
  log_interval: 256