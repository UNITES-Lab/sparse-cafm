dataset:
    value:
        crop_size: 128
        image_size: 512
        masking_ratio: 1
        name: MOS2SRDataset
        num_workers: 0
global:
    value:
        device: 0
        formulation: 2x-sr
        mode: train
logging:
    value:
        enable_tensorboard: false
        exp_name: bto
        log_figures: false
        log_interval: 1
        result_columns: []
        root: __exps__/bto
        save_only_best_weights: true
        save_weights: true
model:
    value:
        config: model-configs/001_classic_img_sr-2x-sr64.yaml
        name: ours
        pretrained: false
        weights: __weights__/2x/DS={all}-[X|y]-BS=32-opt=Adam-lr=1e-5_best.pth
surrogate:
    value:
        name: ""
        weights: null
training:
    value:
        batch_size: 1
        epochs: 200
        loss: L1
        lr: "1e-5"
        optimizer: Adam
        steps_per_epoch: 1024
validation:
    value:
        batch_size: 1
        loss: L1
        steps_per_epoch: 256
