global:
  device: 0
  mode: train  # ['train', 'eval']
  formulation: 8x-sr

model:
  name: ours
  pretrained: True
  weights:
  config: model-configs/001_classic_img_sr-8x-s48.yaml

training:
  batch_size: 8
  steps_per_epoch: 1024
  epochs: 50
  loss: L1
  lr: 1e-6
  optimizer: AdamW

validation:
  batch_size: 1
  steps_per_epoch: 256
  loss: L1

dataset:
  name: MOS2SEFDataset
  image_size: 512
  crop_size: 384
  num_workers: 8
  masking_ratio: 1

logging:
  root: "/playpen/mufan/levi/tianlong-chen-lab/material-super-resolution/__exps__/y-task-formulations/4x-sr"
  exp_name: swinir-4x-sr
  result_columns: []
  save_weights: true
  save_only_best_weights: true
  enable_tensorboard: false
  log_figures: false
  log_interval: 1