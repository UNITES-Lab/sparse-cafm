global:
  device: 0
  mode: train  # ['train', 'eval']
  formulation: p(y|y_sparse)

model:
  name: ours
  pretrained: True
  weights:
  config: model-configs/swinir.yaml

training:
  batch_size: 1
  steps_per_epoch: 1024
  epochs: 2000
  loss: InpaintingL1
  lr: 1e-4
  optimizer: Adam

validation:
  batch_size: 1
  steps_per_epoch: 256
  loss: InpaintingL1

dataset:
  name: SapphireDataset
  image_size: 224
  crop_size: 128
  num_workers: 0
  masking_ratio: 1

logging:
  root: "/playpen/mufan/levi/tianlong-chen-lab/material-super-resolution/__exps__/y-task-formulations/6. p(y | y_sparse)/6a. train-runs"
  exp_name: swinir-no-sigmoid-old-channel-downsample
  result_columns: ["global_train_step", "global_val_step", "epoch", "train_loss", "val_loss", "z"]
  save_weights: true
  save_only_best_weights: true
  enable_tensorboard: false
  log_figures: false
  log_interval: 1