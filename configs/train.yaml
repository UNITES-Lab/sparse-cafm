global:
  device: 0

model:
  name: unet
  pretrained: True

training:
  batch_size: 4
  steps_per_epoch: 1024
  epochs: 2000
  loss: L1
  lr: 1e-4
  optimizer: Adam

validation:
  batch_size: 16
  steps_per_epoch: 256
  loss: L1

dataset:
  name: SapphireDataset
  image_size: 224
  crop_size: 64
  num_workers: 0
  masking_ratio: 1

logging:
  root: "/playpen/mufan/levi/tianlong-chen-lab/material-super-resolution/__exps__/y-task-formulations/5. receptive-field"
  exp_name: up-5, down-5
  result_columns: ["global_train_step", "global_val_step", "epoch", "train_loss", "val_loss", "z"]
  save_weights: false
  save_only_best_weights: false
  enable_tensorboard: false
  log_figures: false
  log_interval: 1