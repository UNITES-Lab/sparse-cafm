global:
  device: 0
  mode: eval
  formulation: p(y|y_sparse_benchmark)

model:
  name: unet
  pretrained: True
  weights: /playpen/mufan/levi/tianlong-chen-lab/material-super-resolution/__exps__/y-task-formulations/6. p(y | y_sparse)/6a. train-runs/2025-01-26_14-32-37_unet_sigmoid_128x128_new_ds_no_logger_renorm/unet_sigmoid_128x128_new_ds_no_logger_renorm_best.pt

validation:
  batch_size: 1
  steps_per_epoch: 1000
  loss: InpaintingL1

dataset:
  name: SapphireDataset
  image_size: 224
  crop_size: 128  
  num_workers: 0
  masking_ratio: 1

logging:
  root: /playpen/mufan/levi/tianlong-chen-lab/material-super-resolution/__exps__/y-task-formulations/6. p(y | y_sparse)/6b. evals
  exp_name: unet-revisted-50%-sparse
